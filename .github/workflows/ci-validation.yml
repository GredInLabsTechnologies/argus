name: Build Virtual Display Driver

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  VDD_DIR: Virtual Display Driver (HDR)
  VDD_SOLUTION: Virtual Display Driver (HDR)/MttVDD.sln

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Provision the WDK + SDK headers (IddCx.h) and the WindowsUserModeDriver10.0 toolset via NuGet.
      # This is how Microsoft's own Windows-driver-samples build on GitHub Actions runners, which ship
      # an SDK but not a matching WDK. The restored packages are picked up by Directory.Build.props in
      # the project directory (conditional imports — local EWDK builds are unaffected).
      # Restore under the repo ROOT (no parentheses): the WDK MSBuild task assembly fails to load
      # from a path containing '(' — see Directory.Build.props.
      - name: Restore WDK/SDK NuGet packages (IddCx.h + driver toolset)
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      # The NuGet WDK ships build tools (stampinf.exe, inf2cat.exe, …) in its bin folder, but they
      # aren't on PATH. Add the x64 host-tools bin so the build can find stampinf (error TRK0005).
      - name: Add WDK build tools to PATH
        shell: pwsh
        run: |
          # Locate stampinf.exe wherever the WDK NuGet package places it (its content lives under
          # a 'c\' subfolder; layout varies by version), and add that folder to PATH. inf2cat/makecat
          # live alongside it.
          $tool = Get-ChildItem "packages\Microsoft.Windows.WDK.x64.*" -Recurse -Filter "stampinf.exe" -File -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "stampinf.exe not found anywhere under packages\Microsoft.Windows.WDK.x64.*" }
          Write-Output "WDK tools bin: $($tool.DirectoryName)"
          Add-Content -Path $env:GITHUB_PATH -Value $tool.DirectoryName

      - name: Build VDD (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sln = "${{ env.VDD_SOLUTION }}"
          if (-not (Test-Path $sln)) { throw "VDD solution file not found at: $sln" }

          msbuild $sln `
            /m `
            /t:Build `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ matrix.platform }}" `
            /p:EnableInfVerif=false `
            /p:RunApiValidator=false `
            /verbosity:minimal

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "${{ env.VDD_DIR }}\${{ matrix.platform }}\${{ env.BUILD_CONFIGURATION }}\MttVDD"
          if (-not (Test-Path $outDir)) { throw "Build output directory not found: $outDir" }

          $dest = "artifacts\VDD\${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$outDir\*" -Destination $dest -Recurse -Force

      - name: Upload artifacts (unsigned)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
          path: artifacts/VDD/${{ matrix.platform }}/
          if-no-files-found: error

      # ── Firma de producción del driver (SignPath Foundation, OV Authenticode, gratis para OSS) ──
      # Condicional: solo corre cuando el proyecto ya está dado de alta en SignPath y los secrets/vars
      # existen. Hasta entonces el CI compila sin romperse. Setup en docs/SIGNING.md.
      - name: Sign driver catalog (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'argus'
          artifact-configuration-slug: 'driver-cat'
          signing-policy-slug: >-
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
              && 'release-signing' || 'test-signing' }}
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'artifacts/VDD/${{ matrix.platform }}-signed'

      - name: Upload artifacts (SIGNED)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}-SIGNED
          path: artifacts/VDD/${{ matrix.platform }}-signed/
          if-no-files-found: error
