name: Build Virtual Display Driver

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  VDD_SOLUTION: Virtual Display Driver (HDR)/MttVDD.sln
  # Deterministic, architecture-coherent DriverVer. With DriverVer= blank in the INF and no
  # Enable VersionStamp/DateStamp, stampinf derives the version from each arch's ntverp.h (so x64 and
  # ARM64 disagree) and stamps the build date (non-reproducible across the parallel jobs). Forcing
  # STAMPINF_VERSION/STAMPINF_DATE makes both jobs stamp identical, reproducible values. Bump per release.
  STAMPINF_VERSION: "0.1.0.0"
  STAMPINF_DATE: "06/21/2026"

permissions:
  contents: read

jobs:
  build:
    # The WDK NuGet package builds driver projects only on a runner that ships the matching Visual
    # Studio + WDK build integration. windows-2025-vs2026 is the public GitHub-hosted image Microsoft
    # uses to keep its own Windows-driver-samples CI green ("configured with Visual Studio 2026 off
    # the box, so most solutions can be built by running msbuild directly using the WDK NuGet
    # package" — Windows-driver-samples/.github/Build-with-GitHub.md). windows-latest cannot: it
    # mis-resolves the WDK toolset (wrong stampinf arch, WDF/IddCx version skew).
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Put msbuild on PATH (the vs2026 runner ships it, but not on the PowerShell PATH by default).
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Provision the WDK + SDK (IddCx.h, libs, the WindowsUserModeDriver10.0 toolset) via NuGet —
      # the exact packages.config Microsoft restores for Windows-driver-samples. The restored
      # packages are picked up by Directory.Build.props at the repo root (conditional imports, so a
      # local EWDK build is unaffected).
      - name: Restore WDK/SDK NuGet packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      # With the WDK supplied via NuGet (rather than the runner's installed WDK that a full VS dev
      # shell would expose), MSBuild can't locate stampinf.exe (TRK0005). Point the .inf-stamping
      # tools at the NuGet bin explicitly: stampinf in c\bin\<ver>\x64, Inf2Cat in x86. The WDK
      # targets only apply their own defaults when these are empty, and MSBuild reads env as
      # properties, so ours win.
      - name: Pin WDK .inf tools (stampinf/inf2cat) to the NuGet bin
        shell: pwsh
        run: |
          $root = Get-ChildItem "packages\Microsoft.Windows.WDK.x64.*\c\bin" -Directory -ErrorAction SilentlyContinue |
                  Get-ChildItem -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          if (-not $root) { throw "WDK bin root not found under packages\Microsoft.Windows.WDK.x64.*\c\bin" }
          $x64 = Join-Path $root.FullName 'x64'
          $x86 = Join-Path $root.FullName 'x86'
          if (-not (Test-Path (Join-Path $x64 'stampinf.exe'))) { throw "stampinf.exe not at $x64" }
          foreach ($p in @($x64,$x86)) { if (Test-Path $p) { Add-Content -Path $env:GITHUB_PATH -Value $p } }
          Add-Content -Path $env:GITHUB_ENV -Value "InfToolPath=$x64\"
          Add-Content -Path $env:GITHUB_ENV -Value "InfToolArchitecture=Native64Bit"
          Add-Content -Path $env:GITHUB_ENV -Value "Inf2CatToolPath=$x86\"
          Write-Output "Pinned InfToolPath=$x64\ ; Inf2CatToolPath=$x86\"

      - name: Build VDD (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sln = "${{ env.VDD_SOLUTION }}"
          if (-not (Test-Path $sln)) { throw "VDD solution file not found at: $sln" }

          # INF/API validation are off: this job validates that the driver compiles, not WHQL specs.
          # UMDF_VERSION_MINOR=25 as a global property keeps the project's per-config value applied.
          # The WDF headers are routed by the .vcxproj's AdditionalIncludeDirectories, which now lists
          # $(WDKContentRoot)\Include\wdf\umdf\2.25 (where the NuGet WDK actually ships them) ahead of
          # the vendored 2.15 fallback, so IddCx 1.10 gets the WDF 2.25 it needs.
          msbuild $sln `
            /m `
            /t:Build `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ matrix.platform }}" `
            /p:TargetVersion=Windows10 `
            /p:UMDF_VERSION_MINOR=25 `
            /p:EnableInfVerif=false `
            /p:RunApiValidator=false `
            /verbosity:minimal

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "Virtual Display Driver (HDR)\${{ matrix.platform }}\${{ env.BUILD_CONFIGURATION }}\MttVDD"
          if (-not (Test-Path $outDir)) { throw "Build output directory not found: $outDir" }

          $dest = "artifacts\VDD\${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$outDir\*" -Destination $dest -Recurse -Force

      - name: Upload artifacts (unsigned)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
          path: artifacts/VDD/${{ matrix.platform }}/
          if-no-files-found: error

      # ── Production driver signing (SignPath Foundation, OV Authenticode, free for OSS) ──
      # Conditional: only runs once the project is enrolled in SignPath and the secrets/vars exist.
      # Until then CI compiles green without it. Setup in docs/SIGNING.md.
      - name: Sign driver catalog (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'argus'
          artifact-configuration-slug: 'driver-cat'
          signing-policy-slug: >-
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
              && 'release-signing' || 'test-signing' }}
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'artifacts/VDD/${{ matrix.platform }}-signed'

      - name: Upload artifacts (SIGNED)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}-SIGNED
          path: artifacts/VDD/${{ matrix.platform }}-signed/
          if-no-files-found: error
