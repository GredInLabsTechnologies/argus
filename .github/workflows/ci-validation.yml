name: Build Virtual Display Driver

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  VDD_DIR: Virtual Display Driver (HDR)
  VDD_SOLUTION: Virtual Display Driver (HDR)/MttVDD.sln

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Provision the WDK + SDK headers (IddCx.h) and the WindowsUserModeDriver10.0 toolset via NuGet.
      # This is how Microsoft's own Windows-driver-samples build on GitHub Actions runners, which ship
      # an SDK but not a matching WDK. The restored packages are picked up by Directory.Build.props in
      # the project directory (conditional imports — local EWDK builds are unaffected).
      # Restore under the repo ROOT (no parentheses): the WDK MSBuild task assembly fails to load
      # from a path containing '(' — see Directory.Build.props.
      - name: Restore WDK/SDK NuGet packages (IddCx.h + driver toolset)
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      # The NuGet WDK ships build tools (stampinf.exe in x64, Inf2Cat.exe in x86) under
      # <pkg>\c\bin\<ver>\{x64,x86,arm64}\, but the WDK's own auto-resolution mis-picks the ARM64
      # stampinf on this x64 runner (FileTracker 0xd8 = EXE machine-type mismatch). Pin the tool
      # paths/arch explicitly via env vars — MSBuild reads env as properties, and the WDK targets
      # only set their defaults when these are empty (Condition="'$(InfToolPath)' == ''"), so ours win.
      - name: Pin WDK build tools (stampinf/inf2cat) to the x64 host
        shell: pwsh
        run: |
          $root = Get-ChildItem "packages\Microsoft.Windows.WDK.x64.*\c\bin" -Directory -ErrorAction SilentlyContinue |
                  Get-ChildItem -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending | Select-Object -First 1
          if (-not $root) { throw "WDK bin root not found under packages\Microsoft.Windows.WDK.x64.*\c\bin" }
          $x64 = Join-Path $root.FullName 'x64'
          $x86 = Join-Path $root.FullName 'x86'
          if (-not (Test-Path (Join-Path $x64 'stampinf.exe'))) { throw "stampinf.exe not at $x64" }
          foreach ($p in @($x64,$x86)) { if (Test-Path $p) { Add-Content -Path $env:GITHUB_PATH -Value $p } }
          # stampinf.exe lives in x64 (run as 64-bit host tool); Inf2Cat.exe lives in x86.
          Add-Content -Path $env:GITHUB_ENV -Value "InfToolPath=$x64\"
          Add-Content -Path $env:GITHUB_ENV -Value "InfToolArchitecture=Native64Bit"
          Add-Content -Path $env:GITHUB_ENV -Value "Inf2CatToolPath=$x86\"
          Write-Output "Pinned InfToolPath=$x64\ ; Inf2CatToolPath=$x86\"

      - name: Build VDD (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sln = "${{ env.VDD_SOLUTION }}"
          if (-not (Test-Path $sln)) { throw "VDD solution file not found at: $sln" }

          msbuild $sln `
            /m `
            /t:Build `
            /p:Configuration="${{ env.BUILD_CONFIGURATION }}" `
            /p:Platform="${{ matrix.platform }}" `
            /p:EnableInfVerif=false `
            /p:RunApiValidator=false `
            /verbosity:minimal

      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "${{ env.VDD_DIR }}\${{ matrix.platform }}\${{ env.BUILD_CONFIGURATION }}\MttVDD"
          if (-not (Test-Path $outDir)) { throw "Build output directory not found: $outDir" }

          $dest = "artifacts\VDD\${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$outDir\*" -Destination $dest -Recurse -Force

      - name: Upload artifacts (unsigned)
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
          path: artifacts/VDD/${{ matrix.platform }}/
          if-no-files-found: error

      # ── Firma de producción del driver (SignPath Foundation, OV Authenticode, gratis para OSS) ──
      # Condicional: solo corre cuando el proyecto ya está dado de alta en SignPath y los secrets/vars
      # existen. Hasta entonces el CI compila sin romperse. Setup en docs/SIGNING.md.
      - name: Sign driver catalog (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'argus'
          artifact-configuration-slug: 'driver-cat'
          signing-policy-slug: >-
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
              && 'release-signing' || 'test-signing' }}
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'artifacts/VDD/${{ matrix.platform }}-signed'

      - name: Upload artifacts (SIGNED)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VDD-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}-SIGNED
          path: artifacts/VDD/${{ matrix.platform }}-signed/
          if-no-files-found: error
